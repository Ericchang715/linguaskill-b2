<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5ef">
  <meta name="description" content="繁體中文 Linguaskill B2 英語練習工作台，含完形填空、字彙練習、繁中解析與學習紀錄。">
  <title>Linguaskill B2 英語練習工作台</title>
  <link rel="icon" type="image/svg+xml" href="./assets/mark.svg">
  <link rel="stylesheet" href="./assets/style.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳至主要內容</a>
  <div class="layout">
    <aside class="sidebar">
      <header class="brand-row">
        <a class="brand" href="#desk" aria-label="Linguaskill B2 工作台總覽">
          <img src="./assets/mark.svg" alt="" width="43" height="43">
          <span><strong lang="en">Linguaskill <small>B2</small></strong><span>英語練習工作台</span></span>
        </a>
        <button class="btn quiet mobile-menu" type="button" data-action="menu" aria-controls="site-nav" aria-expanded="false"><span data-icon="menu"></span>選單</button>
      </header>
      <nav id="site-nav" aria-label="主要選單">
        <div class="nav-group">
          <p>練習</p>
          <a href="#desk" data-route="desk"><span data-icon="grid"></span>工作台總覽</a>
          <a href="#bank" data-route="bank"><span data-icon="book"></span>練習題庫</a>
          <a href="#history" data-route="history"><span data-icon="history"></span>練習歷程</a>
          <a href="#errors" data-route="errors"><span data-icon="flag"></span>錯題複習<span class="nav-count" id="wrong-count" hidden></span></a>
          <a href="#words" data-route="words"><span data-icon="bookmark"></span>待複習單字<span class="nav-count" id="word-count" hidden></span></a>
        </div>
        <div class="nav-group">
          <p>管理</p>
          <a href="#manage" data-route="manage"><span data-icon="folder"></span>題庫管理</a>
          <a href="#help" data-route="help"><span data-icon="help"></span>使用說明與備份</a>
        </div>
      </nav>
      <div class="sidebar-foot"><i aria-hidden="true"></i><div><strong>本機學習紀錄</strong><p id="storage-label">進度保存在此瀏覽器</p></div></div>
    </aside>
    <main id="main" tabindex="-1">
      <div class="main-inner">
        <div id="warning" class="warning" role="status" hidden></div>
        <div id="page"><p>正在載入練習題庫。</p></div>
        <footer><span>Linguaskill B2 · 個人練習工作台</span><a href="#help">使用說明</a></footer>
      </div>
    </main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" role="status" hidden></div>
  <noscript><p class="warning">請開啟 JavaScript 後使用練習工作台。</p></noscript>
</body>
</html>
